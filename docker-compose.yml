services:
  postgres:
    image: postgres:16-alpine
    container_name: worknest-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: worknest
    volumes:
      - worknest_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worknest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  worknest_pg_data:
